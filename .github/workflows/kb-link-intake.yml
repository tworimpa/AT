name: KB Link Intake with Gemini

on:
  issues:
    types:
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS URL to analyze
        required: true
        type: string
      note:
        description: Optional analysis focus
        required: false
        type: string

concurrency:
  group: kb-link-intake-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze link
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[KB 링크]') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.render.outputs.decision }}
      issue_number: ${{ steps.intake.outputs.issue_number }}
      record_name: ${{ steps.intake.outputs.record_name }}
      source_id: ${{ steps.intake.outputs.source_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate and prepare intake
        id: intake
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NOTE: ${{ inputs.note }}
        run: python3 scripts/kb_link_intake.py prepare

      - name: Analyze public source with Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: >-
          python3 scripts/kb_link_intake.py analyze
          --response-json gemini-artifacts/response.json

      - name: Validate decision and render result
        id: render
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: >-
          python3 scripts/kb_link_intake.py render
          --response-json gemini-artifacts/response.json

      - name: Validate knowledge base
        if: steps.render.outputs.decision == 'add'
        run: python3 scripts/validate_knowledge_base.py

      - name: Upload proposed record
        if: steps.render.outputs.decision == 'add'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kb-link-record-${{ github.run_id }}
          path: knowledge-base/execution-records/${{ steps.intake.outputs.record_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload skip reason
        if: >-
          steps.render.outputs.decision == 'skip' &&
          steps.intake.outputs.issue_number != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kb-link-skip-${{ github.run_id }}
          path: gemini-artifacts/kb-link-skip-comment.md
          if-no-files-found: error
          retention-days: 7

      - name: Add manual skip reason to job summary
        if: >-
          steps.render.outputs.decision == 'skip' &&
          steps.intake.outputs.issue_number == ''
        run: cat gemini-artifacts/kb-link-skip-comment.md >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Open review PR
    needs:
      - analyze
    if: needs.analyze.outputs.decision == 'add'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download proposed record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kb-link-record-${{ github.run_id }}
          path: knowledge-base/execution-records

      - name: Validate proposed change
        env:
          RECORD_NAME: ${{ needs.analyze.outputs.record_name }}
        run: |-
          set -euo pipefail
          test -f "knowledge-base/execution-records/${RECORD_NAME}"
          python3 scripts/validate_knowledge_base.py
          git diff --check

      - name: Commit and push review branch
        id: push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.analyze.outputs.issue_number }}
          RECORD_NAME: ${{ needs.analyze.outputs.record_name }}
          SOURCE_ID: ${{ needs.analyze.outputs.source_id }}
        run: |-
          set -euo pipefail

          branch="automation/kb-link-${SOURCE_ID}-${GITHUB_RUN_ID}"
          record_path="knowledge-base/execution-records/${RECORD_NAME}"
          pr_body_file="${RUNNER_TEMP}/kb-link-pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -- "${record_path}"
          git diff --cached --check
          git commit -m "docs(kb): add ${SOURCE_ID} link analysis"
          git push origin "HEAD:refs/heads/${branch}"

          printf '%s\n' \
            'Gemini가 생성한 링크 분석 기록입니다.' \
            '' \
            '- 자동 병합되지 않습니다.' \
            '- 원문 주장과 모델 분석을 검토한 뒤 병합해 주세요.' \
            '- 정적 KB validator를 통과한 기록만 포함합니다.' \
            > "${pr_body_file}"

          pr_url="$(gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "docs(kb): ${SOURCE_ID} 링크 분석" \
            --body-file "${pr_body_file}")"
          printf 'pr_url=%s\n' "${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Comment on source issue
        if: needs.analyze.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.analyze.outputs.issue_number }}
          PR_URL: ${{ steps.push.outputs.pr_url }}
        run: >-
          gh issue comment "${ISSUE_NUMBER}"
          --body "Gemini 링크 분석을 완료하고 검토용 PR을 만들었습니다: ${PR_URL}"

  report-skip:
    name: Report skip reason
    needs:
      - analyze
    if: >-
      needs.analyze.outputs.decision == 'skip' &&
      needs.analyze.outputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Download skip reason
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kb-link-skip-${{ github.run_id }}
          path: ${{ runner.temp }}/kb-link-skip

      - name: Comment reason on source issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.analyze.outputs.issue_number }}
        run: >-
          gh issue comment "${ISSUE_NUMBER}"
          --body-file "${RUNNER_TEMP}/kb-link-skip/kb-link-skip-comment.md"
